<!doctype html>

<head>
<!--
====================================================================
SÜRÜM BİLGİSİ (Puantaj Takip)
====================================================================
Sürüm:            v1.2.0
Son Değişiklik:   2026-08-04
Dosya:            index.html + src/ (Vite projesi; artık tek dosya değil — bkz. README.md)

DEĞİŞİKLİK GÜNLÜĞÜ (CHANGELOG)
--------------------------------------------------------------------
v1.2.0 - 2026-08-04
  Proje, tek dosyalık HTML/JS yapısından production kalitesinde bir
  Vite + Vanilla JS projesine taşındı. İş mantığı, ekranlar, CSS ve
  hesaplamalar BİREBİR KORUNDU; sadece kod organizasyonu değişti:
  - JavaScript, 9 bağımsız ES modülüne ayrıldı (storage, utils,
    settings, period-utils, state, calculations, render, modals,
    handlers) — src/modules/ klasörü altında.
  - Paylaşımlı uygulama durumu (EMP, SETTINGS, period, ATT, OT, ADV,
    SPECIAL, currentTab, selectedDay, ozetGizli) tek bir `state`
    nesnesinde toplandı (modüller arası paylaşım için).
  - Excel kütüphanesi artık CDN üzerinden değil, npm paketi olarak
    (`xlsx`) build'e gömülüyor — çevrimdışı ortamda bile Excel
    dışa aktarma çalışır (önceki sürümde internet gerektiriyordu).
  - Vite ile geliştirme sunucusu (npm run dev), production build
    (npm run build) ve Vercel'e doğrudan deploy desteği eklendi.

v1.1.0 - 2026-08-03
  Depolama katmanı, Claude'a özel window.storage API'sinden standart
  tarayıcı teknolojisine (IndexedDB, gerekli durumda localStorage
  yedeği) taşındı. Bu sayede dosya artık Claude ortamı dışında,
  doğrudan Chrome/Edge/Firefox'ta veya herhangi bir web sunucusunda
  ek bir bağımlılık olmadan çalışır. loadJSON()/saveJSON() imzaları
  ve tüm iş mantığı, ekranlar, hesaplamalar ve CSS AYNEN KORUNDU;
  sadece depolamanın alt katmanı değişti. "Çoklu cihaz çakışma
  kontrolü" davranışı artık "aynı tarayıcıda açık birden fazla
  sekme" senaryosunu korur (bkz. aşağıdaki güncel bilinen sınır).

v1.0.0 - 2026-08-03
  İlk kararlı sürüm. Bu sürüme kadar yapılan tüm geliştirme ve
  düzeltmeler aşağıda özetlenmiştir:

  Temel özellikler:
  - Personel, Puantaj, Mesailer, Avans/Kesinti, Aylık Özet ve
    Ayarlar sekmeleri; kişisel window.storage üzerinde saklama.
  - Dokunmatik/tap tabanlı puantaj girişi: gün durumu (Tam Gün,
    Yarım Gün, Ücretsiz İzin, Yıllık İzin, Rapor) tek seçim;
    İÇ/İD/YOL ek ödeme etiketleri aynı gün için birlikte
    seçilebilir ve ayrı ayrı toplanır.
  - Geç kalma/erken çıkış kesintilerinin saat üzerinden girilip
    saatlik ücretle otomatik hesaplanması.
  - Yıllık izin gün sayısının yıl genelinde takibi.
  - Bordro Listesi (A-Z), CSV ve Excel (.xlsx) dışa aktarma,
    yazdırma (Bordro Listesi ve personel detay kartı için ayrı
    kapsamlı yazdırma).
  - Tutarları gizleme/gösterme anahtarı (Özet ve Bordro Listesi).

  Hata düzeltmeleri:
  - Excel Puantaj sayfasında "[object Object]" hatası giderildi.
  - Ayarlar'da sıfır/negatif günlük saat veya ay gün sayısı girişi
    engellendi (bölme hatası riski).
  - Kullanıcı girdisi alanlarında HTML/script enjeksiyonuna karşı
    kaçış (escaping) uygulandı.
  - Personel formuna eksik "Birim" alanı eklendi.
  - Depolama sağlığı kontrolü ve kalıcı uyarı eklendi.
  - Personel silindiğinde tüm dönemlerdeki puantaj, mesai ve
    avans kayıtlarının da temizlenmesi (tek merkezi fonksiyon).
  - Period (dönem) formatı doğrulaması (yalnızca YYYY-MM).
  - Yıllık izin hesaplamasının paralelleştirilmesi (Promise.all).
  - apple-touch-icon eklendi.
  - Aynı storage anahtarına yapılan ardışık yazmaların anahtar
    bazlı kuyrukla sıraya alınması.
  - Bozuk (parse edilemeyen) JSON ile "veri yok" durumunun
    ayrıştırılıp kullanıcıya bildirilmesi.
  - Yazma öncesi karşılaştırmalı çakışma kontrolü (best-effort;
    atomik değildir — bkz. aşağıdaki bilinen sınır).

  Bilinen sınırlar (v1.0.0 zamanında):
  - Çoklu cihaz çakışma kontrolü "check-then-act" desenidir,
    atomik compare-and-swap değildir; window.storage API'si
    sürüm/ETag desteklemez ve dokümantasyonuna göre "last write
    wins" ilkesiyle çalışır. Bu nedenle iki cihaz aynı eski
    sürümü okuyup art arda (kontrol penceresi içinde) yazarsa,
    ikinci yazma birinciyi sessizce ezebilir. Mevcut API ile bu
    risk azaltılabilir ama tamamen ortadan kaldırılamaz.
--------------------------------------------------------------------
Bundan sonraki her değişiklik bu bloğa yeni bir "vX.Y.Z - Tarih"
girdisi olarak eklenmelidir.
====================================================================
-->
